<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1740" height="1600" fill="#f4f9ff"/><text x="40" y="52" font-family="Arial" font-size="34" fill="#101a44">Lesson 45 · Configure → delegate → enforce → consolidate</text><rect x="20" y="90" width="300" height="80" rx="16" fill="#087fff"/><text x="170" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Student UI</text><path d="M170 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="370" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="520" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">TypeScript host</text><path d="M520 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="720" y="90" width="300" height="80" rx="16" fill="#00a977"/><text x="870" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">SDK runtime</text><path d="M870 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1070" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="1220" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Children</text><path d="M1220 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1420" y="90" width="300" height="80" rx="16" fill="#ee5425"/><text x="1570" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Service files</text><path d="M1570 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><text x="180" y="227" fill="#142d53" font-family="Arial" font-size="24">1. Choose explicit classroom limits</text><path d="M170 245 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="325" fill="#142d53" font-family="Arial" font-size="24">2. Build string-valued cap environment</text><path d="M520 343 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="423" fill="#142d53" font-family="Arial" font-size="24">3. Apply the native spend cap</text><path d="M520 441 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="521" fill="#142d53" font-family="Arial" font-size="24">4. Preserve the launching environment</text><path d="M520 539 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="619" fill="#142d53" font-family="Arial" font-size="24">5. Define a coordinator that can request a grandchild</text><path d="M870 637 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="717" fill="#142d53" font-family="Arial" font-size="24">6. Detect actual direct and nested Agent calls</text><path d="M870 735 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="815" fill="#142d53" font-family="Arial" font-size="24">7. Retain native tool refusal results</text><path d="M870 833 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="913" fill="#142d53" font-family="Arial" font-size="24">8. Handle the native budget result before the exception</text><path d="M870 931 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="1230" y="1011" fill="#142d53" font-family="Arial" font-size="24">9. Scope file access independently</text><path d="M1220 1029 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1109" fill="#142d53" font-family="Arial" font-size="24">10. Launch the reviewed Workflow script</text><path d="M520 1127 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="1207" fill="#142d53" font-family="Arial" font-size="24">11. Declare native workflow metadata and inputs</text><path d="M870 1225 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="1230" y="1305" fill="#142d53" font-family="Arial" font-size="24">12. Coordinate reviewers and return one result</text><path d="M1220 1323 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Independently verify fixture integrity</text><path d="M520 1421 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/></svg>